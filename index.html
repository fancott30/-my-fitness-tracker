<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Fitness">
<link rel="manifest" href="manifest.json">
<title>My 12-Week Fitness</title>
<style>
:root{--navy:#0b1f3a;--blue:#173b68;--bg:#f4f7fb;--card:#fff;--text:#122033;--muted:#6d7b8c;--line:#e4eaf1;--green:#19a974;--shadow:0 8px 28px rgba(18,32,51,.08)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:28px}
header{background:linear-gradient(145deg,#0b1f3a,#173b68);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 28px 28px}
.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:25px;font-weight:800}.sub{opacity:.72;font-size:13px;margin-top:3px}
.weekbar{display:flex;gap:8px;overflow:auto;padding:14px 0 2px;scrollbar-width:none}.weekbar::-webkit-scrollbar{display:none}.week{flex:0 0 auto;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:8px 11px;font-weight:700;font-size:12px}.week.active{background:#fff;color:var(--navy)}
main{max-width:720px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:-5px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:var(--shadow)}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
.progress{margin-top:12px;background:var(--card);border:1px solid var(--line);padding:13px;border-radius:17px}.bar{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--green);width:0;transition:.25s}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.daynav h2{margin:0;font-size:21px}.navbtn{border:0;background:var(--card);border:1px solid var(--line);width:38px;height:38px;border-radius:12px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:10px 0;padding:15px;box-shadow:var(--shadow)}.card h3{margin:0 0 12px;font-size:16px}.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}.item:first-of-type{border-top:0}.check{appearance:none;width:23px;height:23px;border:2px solid #c7d1dd;border-radius:7px;flex:0 0 23px;margin:0}.check:checked{background:var(--green);border-color:var(--green);position:relative}.check:checked:after{content:"✓";color:white;font-weight:900;position:absolute;left:4px;top:-1px}.time{font-size:11px;color:var(--blue);font-weight:800;margin-bottom:3px}.activity{font-size:14px;line-height:1.35}.done .activity{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-block;background:#eef3f8;color:var(--blue);font-size:10px;font-weight:800;border-radius:99px;padding:4px 7px;margin-top:5px}footer{padding:8px 16px;color:var(--muted);font-size:11px;text-align:center}button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<header><div class="top"><div><div class="title">My 12-Week Fitness</div><div class="sub">Your daily plan • tap to complete</div></div><div style="font-size:28px">💪</div></div><div class="weekbar" id="weeks"></div></header>
<main><div class="stats"><div class="stat"><b>84.5 → 76 kg</b><span>First target</span></div><div class="stat"><b>1,900–2,050</b><span>kcal/day</span></div><div class="stat"><b>150–170g</b><span>protein/day</span></div></div><div class="progress"><b id="progressText">Today: 0%</b><div class="bar"><div class="fill" id="fill"></div></div></div><div class="daynav"><button class="navbtn" onclick="changeDay(-1)">‹</button><h2 id="dayTitle"></h2><button class="navbtn" onclick="changeDay(1)">›</button></div><div id="content"></div></main><footer>Progress is saved automatically on this device.</footer>
<script>
const plan={
"Monday":{focus:"Chest + Triceps",items:[["06:00","Brisk walk","40–50 min • steady pace","Cardio"],["07:30","Breakfast","3 eggs + 2 whole-wheat bread + banana + 150g Greek yogurt","Meal"],["13:00","Lunch","200g cooked rice + 180g chicken + 100g stew + 150g vegetables","Meal"],["16:30","Pre-gym","Apple + 150g Greek yogurt","Meal"],["17:30","Gym","Bench press 3×8–10 • Incline DB press 3×10–12 • Chest fly 3×12–15 • Triceps pushdown 3×10–15 • Overhead extension 2×12–15 • Plank 3×30–45 sec","Gym"],["19:30","Dinner","180g fish + 150g potatoes + 200g salad","Meal"]]},
"Tuesday":{focus:"Back + Biceps",items:[["06:00","Brisk walk","40–50 min","Cardio"],["07:30","Breakfast","60g oats + 250ml milk + banana + 2 eggs + 15g groundnuts","Meal"],["13:00","Lunch","200g beans + 150g plantain + 150g chicken + vegetables","Meal"],["16:30","Snack","Orange + 150g Greek yogurt","Meal"],["17:30","Gym","Lat pulldown 3×8–12 • Seated cable row 3×8–12 • DB row 3×10–12 • Face pull 3×12–15 • DB curls 3×10–12 • Hammer curls 2×10–15","Gym"],["19:30","Dinner","150g fish + 150g sweet potato + 200g vegetables","Meal"]]},
"Wednesday":{focus:"Legs + Shoulders",items:[["06:00","Brisk walk","40–50 min","Cardio"],["07:30","Breakfast","3 eggs + 2 bread + 50g avocado + orange + 150g Greek yogurt","Meal"],["13:00","Lunch","150g rice + 150g beans + 180g fish + 80g stew + vegetables","Meal"],["16:30","Pre-gym","Banana + Greek yogurt","Meal"],["17:30","Gym","Squat/leg press 3×8–12 • RDL 3×8–12 • Leg curl 3×10–15 • Shoulder press 3×8–12 • Lateral raise 3×12–15 • Calf raise 3×12–15","Gym"],["19:30","Dinner","120g chicken + large salad + 150g sweet potato","Meal"]]},
"Thursday":{focus:"Recovery + Fat Loss",items:[["06:00","Brisk walk","40–50 min","Cardio"],["07:30","Breakfast","60g oats + 250ml milk + 3 eggs + 150g pawpaw","Meal"],["13:00","Lunch","150g rice + 150g beans + 180g fish + vegetables","Meal"],["16:00","Snack","Apple + Greek yogurt","Meal"],["17:30","Recovery","Rest; optional 20–30 min easy walk","Recovery"],["19:30","Dinner","120g chicken + salad + 150g potato","Meal"]]},
"Friday":{focus:"Chest + Arms + Abs",items:[["06:00","Brisk walk","40–50 min","Cardio"],["07:30","Breakfast","3 eggs + 2 bread + banana + Greek yogurt","Meal"],["13:00","Lunch","180g yam + 180g chicken + 100g stew + vegetables","Meal"],["16:30","Pre-gym","Banana + Greek yogurt","Meal"],["17:30","Gym","Incline bench 3×8–12 • Flat DB press 3×8–12 • Fly 2×12–15 • EZ curl 3×10–12 • Hammer curl 2×10–15 • Pushdown 3×10–15 • Overhead extension 2×10–15 • Cable crunch 3×12–15 • Knee raise 3×10–15","Gym"],["19:30","Dinner","150g fish + 250g vegetables + 100g potato","Meal"]]},
"Saturday":{focus:"Cardio / Optional Full Body",items:[["07:00","Long walk","60–75 min brisk walk","Cardio"],["08:30","Breakfast","3 eggs + 50g oats + 250ml milk + banana","Meal"],["13:00","Lunch","200g rice + 180g chicken + stew + vegetables","Meal"],["17:00","Optional gym","45–60 min full-body gym • skip if tired","Gym"],["19:00","Dinner","Tuna + 2 eggs + salad + 150g sweet potato","Meal"]]},
"Sunday":{focus:"Recovery",items:[["Morning","Recovery","Rest or easy 20–30 min walk","Recovery"],["08:30","Breakfast","3-egg Nigerian omelette + 80g chicken + vegetables + 2 bread + orange","Meal"],["13:00","Lunch","100g prepared eba + 200g vegetable soup + 180g grilled fish + vegetables","Meal"],["16:00","Snack","Greek yogurt + banana","Meal"],["19:00","Dinner","120g chicken + salad + 150g potato","Meal"]]}
};
const days=Object.keys(plan);let week=Number(localStorage.getItem("fitWeek")||1),day=Number(localStorage.getItem("fitDay")||0);
function key(i){return `w${week}d${day}i${i}`}
function renderWeeks(){document.getElementById("weeks").innerHTML=Array.from({length:12},(_,i)=>`<button class="week ${i+1===week?'active':''}" onclick="week=${i+1};localStorage.setItem('fitWeek',week);render()">W${i+1}</button>`).join("")}
function render(){renderWeeks();const d=days[day],p=plan[d];document.getElementById("dayTitle").textContent=`${d} • ${p.focus}`;let done=0,html='<div class="card">';p.items.forEach((x,i)=>{const c=localStorage.getItem(key(i))==="1";if(c)done++;html+=`<label class="item ${c?'done':''}"><input class="check" type="checkbox" ${c?'checked':''} onchange="toggle(${i},this.checked)"><div><div class="time">${x[0]}</div><div class="activity"><b>${x[1]}</b> — ${x[2]}</div><span class="pill">${x[3]}</span></div></label>`});html+='</div>';document.getElementById("content").innerHTML=html;let pct=Math.round(done/p.items.length*100);document.getElementById("progressText").textContent=`Today: ${pct}% complete`;document.getElementById("fill").style.width=pct+"%"}
function toggle(i,v){localStorage.setItem(key(i),v?"1":"0");render()}function changeDay(n){day=(day+n+7)%7;localStorage.setItem("fitDay",day);render()}render();
</script></body></html>
